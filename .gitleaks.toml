# Gitleaks config. Extends the default ruleset and adds repo-specific allowlist entries.
# Default rules: https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml

[extend]
useDefault = true

# The owner's global pre-commit (~/.git-hooks/pre-commit) runs gitleaks with THIS
# file when it exists, instead of ~/.git-hooks/gitleaks.toml, so the org rules
# from the global file are repeated here. Keep them in sync.

[[rules]]
id = "supabase-secret-key"
description = "Supabase secret API key (sb_secret_)"
regex = '''sb_secret_[A-Za-z0-9_\-]{20,}'''
keywords = ["sb_secret_"]

[[rules]]
id = "supabase-jwt-key"
description = "Supabase legacy JWT key (anon / service_role)"
regex = '''eyJhbGciOiJ[A-Za-z0-9_\-]{5,}\.[A-Za-z0-9_\-]{30,}\.[A-Za-z0-9_\-]{20,}'''
keywords = ["eyJhbGciOiJ"]

[[rules]]
id = "anthropic-key-broad"
description = "Anthropic API key"
regex = '''sk-ant-api[0-9]{2}-[A-Za-z0-9_\-]{80,}'''
keywords = ["sk-ant-api"]

# Placeholder-looking findings only. Deliberately no `paths` list: a global path
# entry allowlists the whole file (OR semantics), which let a real key in a doc
# through (verified 2026-11-04).

[[allowlists]]
description = "Placeholder tokens"
regexes = [
  '''<[A-Z_]+>''',                     # <YOUR_TOKEN_HERE> style placeholders
  '''example\.com''',
  '''xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx''',
]
